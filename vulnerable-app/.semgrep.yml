rules:
  - id: lab.sql-injection-fstring-variable
    languages: [python]
    severity: ERROR
    message: Строка SQL формируется через f-string и передаётся в execute.
    patterns:
      - pattern: $CURSOR.execute($QUERY)
      - pattern-inside: |
          $QUERY = f"..."
          ...
  - id: lab.sql-injection-fstring-direct
    languages: [python]
    severity: ERROR
    message: SQL создаётся через f-string непосредственно в execute.
    pattern: $CURSOR.execute(f"...")
  - id: lab.flask-debug-enabled
    languages: [python]
    severity: WARNING
    message: Debug-режим не должен быть включён вне локальной учебной среды.
    pattern: $APP.run(..., debug=True, ...)
  - id: lab.github-token-literal
    languages: [generic]
    severity: ERROR
    message: Строка похожа на токен GitHub; храните секреты вне кода.
    pattern-regex: ghp_[0-9A-Za-z]{30,}
  - id: lab.template-safe-filter
    languages: [generic]
    severity: WARNING
    message: Фильтр safe отключает экранирование и может привести к XSS.
    pattern-regex: \|\s*safe
