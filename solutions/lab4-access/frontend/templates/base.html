<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure Dev Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">SECURE DEV LAB</a>
  <nav>
    <a href="/search">Поиск</a>
    <a href="/comments">Комментарии</a>
    <a href="/profile">Профиль</a>
    {% if session.get('username') %}
      <a href="/logout">Выход ({{ session['username'] }})</a>
    {% else %}
      <a href="/login">Вход</a>
    {% endif %}
  </nav>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer>Только для локального обучения. Не развёртывать в открытой сети.</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
